<svg xmlns="http://www.w3.org/2000/svg" viewBox="212 212 600 600" width="36" height="36">
<defs>
  <mask id="jaw" maskUnits="userSpaceOnUse" x="-100" y="-160" width="200" height="300">
    <rect x="-100" y="-160" width="200" height="300" fill="#fff"/>
    <path d="M-12 -122 H12 V-84 L-12 -84 Z" fill="#000"/>
  </mask>
  <g id="tools" transform="translate(512 610) scale(1.3)">
    <g transform="rotate(45)"><g mask="url(#jaw)">
      <circle cx="0" cy="-78" r="38"/><rect x="-12" y="-78" width="24" height="172" rx="12"/></g></g>
    <g transform="rotate(-45)">
      <rect x="-17" y="-100" width="34" height="76" rx="15"/>
      <rect x="-6" y="-30" width="12" height="118" rx="5"/>
      <path d="M-6 84 H6 L2 100 H-2 Z"/></g>
  </g>
  <!-- body (frosted glass) with a gap at the lid seam and a halo around the tools -->
  <mask id="bodymask" maskUnits="userSpaceOnUse" x="200" y="200" width="624" height="624">
    <rect x="200" y="200" width="624" height="624" fill="#fff"/>
    <rect x="200" y="446" width="624" height="14" fill="#000"/>
    <use href="#tools" fill="#000" stroke="#000" stroke-width="22" stroke-linejoin="round"/>
  </mask>
  <clipPath id="boxclip"><rect x="236" y="356" width="552" height="392" rx="84"/></clipPath>
</defs>
<!-- handle -->
<rect x="394" y="276" width="236" height="120" rx="56" fill="#000"/>
<!-- glass body -->
<g mask="url(#bodymask)">
  <rect x="236" y="356" width="552" height="392" rx="84" fill="#000" fill-opacity="0.26"/>
  <rect x="236" y="356" width="552" height="392" rx="84" fill="none" stroke="#000" stroke-opacity="0.9" stroke-width="12"/>
</g>
<!-- lid band + latches -->
<g clip-path="url(#boxclip)" fill="#000">
  <rect x="236" y="356" width="552" height="90"/>
</g>
<path d="M300 446 a30 30 0 0 0 60 0 Z M664 446 a30 30 0 0 0 60 0 Z" fill="#000"/>
<!-- tools -->
<use href="#tools" fill="#000"/>
</svg>